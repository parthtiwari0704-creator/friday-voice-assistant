[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "friday-voice-assistant"
version = "1.0.0"
description = "F.R.I.D.A.Y.: an open-source, voice-first AI assistant with wake word, Whisper speech recognition, streaming LLM tools and male/female neural voices."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Parth Tiwari" }]
requires-python = ">=3.10"
keywords = ["voice-assistant", "tts", "stt", "whisper", "piper", "llm", "agent", "wake-word"]
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",  # [standard] brings the WebSocket implementation the HUD needs
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "numpy>=1.26",
    "rich>=13.7",
    "typer>=0.12",
    "psutil>=5.9",
]

[project.optional-dependencies]
# Everything for real voice on your computer: neural voices, Whisper, microphone/speakers.
voice = ["piper-tts>=1.3", "faster-whisper>=1.0", "sounddevice>=0.4.6", "pyttsx3>=2.90"]
openai = ["openai>=1.30"]
jarvis = ["mcp>=2.3,<3"]
dev = ["openai>=1.30", "mcp>=2.3,<3", "pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
friday = "friday.cli:app"

[tool.setuptools.packages.find]
include = ["friday*"]

[tool.setuptools.package-data]
friday = ["server/static/*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "BLE", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008", "E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
source = ["friday"]
omit = ["friday/__main__.py"]
